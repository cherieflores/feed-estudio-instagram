<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <title>Feed</title>

  <style>
    :root {
      --feed-width: 470px;
      --border: #dbdbdb;
      --muted: #737373;
      --text: #0a0a0a;
      --bg: #ffffff;
      --topbar-height: 56px;
      --bottom-nav-height: 58px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    img { display: block; max-width: 100%; }
    body { cursor: default; }

    .app {
      width: min(100%, var(--feed-width));
      min-height: 100vh;
      margin: 0 auto;
      background: #fff;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: calc(var(--topbar-height) + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 14px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,.98);
      border-bottom: 1px solid #efefef;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      pointer-events: none;
      user-select: none;
    }

    .wordmark {
      width: 112px;
      height: auto;
      object-fit: contain;
    }

    .top-icons, .action-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .icon {
      width: 25px;
      height: 25px;
      display: inline-flex;
      pointer-events: none;
      user-select: none;
    }
    .icon svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .heart-dot { position: relative; }
    .heart-dot::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      right: -2px;
      top: -1px;
      background: #ff3040;
      border-radius: 50%;
      border: 1.5px solid #fff;
    }

    .stories {
      display: flex;
      gap: 13px;
      overflow-x: auto;
      padding: 11px 10px 10px;
      border-bottom: 1px solid #efefef;
      scrollbar-width: none;
      pointer-events: none;
      user-select: none;
    }
    .stories::-webkit-scrollbar { display: none; }
    .story {
      flex: 0 0 67px;
      width: 67px;
      text-align: center;
    }
    .story-ring {
      width: 62px;
      height: 62px;
      margin: 0 auto 5px;
      padding: 2px;
      border-radius: 50%;
      background: conic-gradient(#d300c5, #ff3040, #ffdc80, #ff3040, #d300c5);
    }
    .story-inner {
      width: 100%;
      height: 100%;
      padding: 2px;
      border-radius: 50%;
      background: #fff;
    }
    .story img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    .story-name {
      display: block;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .feed {
      padding-bottom: calc(var(--bottom-nav-height) + env(safe-area-inset-bottom) + 48px);
    }
    .post {
      border-bottom: 1px solid #efefef;
      background: #fff;
    }
    .post-header {
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      flex: 0 0 auto;
      background: #eee;
    }
    .meta {
      flex: 1;
      min-width: 0;
      line-height: 1.2;
    }
    .username {
      font-size: 14px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }
    .subtitle {
      margin-top: 2px;
      font-size: 12px;
      color: #262626;
      overflow-wrap: anywhere;
    }
    .more {
      font-size: 21px;
      letter-spacing: 1px;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }
    .media {
      width: 100%;
      overflow: hidden;
      background: #f4f4f4;
    }
    .media img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
    }
    .actions {
      height: 47px;
      padding: 10px 12px 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      user-select: none;
    }
    .post-body {
      padding: 0 12px 15px;
      font-size: 14px;
      line-height: 1.42;
      overflow-wrap: anywhere;
    }
    .likes {
      font-weight: 650;
      margin-bottom: 6px;
    }
    .caption {
      margin-bottom: 5px;
    }
    .caption-user, .comment-user {
      font-weight: 650;
      margin-right: 5px;
    }
    .comment { margin: 2px 0; }
    .view-comments {
      margin-top: 5px;
      color: var(--muted);
    }
    .date {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
    }

    .bottom-nav {
      position: fixed;
      z-index: 120;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, var(--feed-width));
      height: calc(var(--bottom-nav-height) + env(safe-area-inset-bottom));
      padding: 0 18px env(safe-area-inset-bottom);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,.99);
      border-top: 1px solid #dedede;
      pointer-events: none;
      user-select: none;
    }
    .bottom-nav .icon { width: 27px; height: 27px; }
    .bottom-profile {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #111;
    }

    @media (min-width: 700px) {
      .app {
        border-left: 1px solid #efefef;
        border-right: 1px solid #efefef;
      }
    }
    @media (max-width: 390px) {
      .wordmark { width: 106px; }
      .stories { gap: 10px; }
      .story { flex-basis: 64px; width: 64px; }
      .story-ring { width: 58px; height: 58px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar" aria-label="Barra superior decorativa">
    <img class="wordmark" src="../shared/assets/instagram-wordmark.png" alt="Instagram">
    <div class="top-icons" aria-hidden="true">
      <span class="icon heart-dot" data-icon="heart"></span>
      <span class="icon" data-icon="share"></span>
    </div>
  </header>

  <section id="stories" class="stories" aria-label="Historias decorativas"></section>
  <main id="feed" class="feed" aria-label="Publicaciones"></main>
</div>

<nav class="bottom-nav" aria-label="Navegación inferior decorativa">
  <span class="icon" data-icon="home"></span>
  <span class="icon" data-icon="search"></span>
  <span class="icon" data-icon="create"></span>
  <span class="icon" data-icon="reels"></span>

</nav>

const stories = posts.map(p => ({ username: p.username, image: p.profileImage }));

const icons = {
  heart: `<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>`,

  share: `<svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4 20-7z"/></svg>`,
  save: `<svg viewBox="0 0 24 24"><path d="M5 3h14a1 1 0 0 1 1 1v17l-8-5-8 5V4a1 1 0 0 1 1-1z"/></svg>`,
  home: `<svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>`,
  search: `<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>`,
  create: `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 7v10M7 12h10"/></svg>`,

document.querySelectorAll("[data-icon]").forEach(el => {
  el.innerHTML = icons[el.dataset.icon] || "";
});

const storiesEl = document.getElementById("stories");
stories.forEach(s => {
  const item = document.createElement("div");
  item.className = "story";
  item.innerHTML = `
    <div class="story-ring">
      <div class="story-inner"><img src="${s.image}" alt=""></div>
    </div>
    <span class="story-name">${s.username}</span>
  `;
  storiesEl.appendChild(item);
});

const feed = document.getElementById("feed");

posts.forEach(post => {
  const article = document.createElement("article");
  article.className = "post";

  const commentsHTML = post.comments.map(c =>
    `<div class="comment"><span class="comment-user">${c.username}</span><span>${c.text}</span></div>`
  ).join("");

  article.innerHTML = `
    <div class="post-header">
      <img class="avatar" src="${post.profileImage}" alt="">
      <div class="meta">
        <div class="username">${post.username}</div>
        ${post.subtitle ? `<div class="subtitle">${post.subtitle}</div>` : ""}
      </div>
      <div class="more" aria-hidden="true">•••</div>
    </div>

    <div class="media" style="aspect-ratio:${post.aspectRatio}">
      <img src="${post.image}" alt="Imagen de publicación" loading="eager" decoding="async">
    </div>

    <div class="actions" aria-hidden="true">
      <div class="action-left">
        <span class="icon">${icons.heart}</span>
        <span class="icon">${icons.comment}</span>
        <span class="icon">${icons.share}</span>
      </div>
      <span class="icon">${icons.save}</span>
    </div>

    <div class="post-body">
      <div class="likes">${post.likesText}</div>
      <div class="caption"><span class="caption-user">${post.username}</span><span>${post.caption}</span></div>
      ${commentsHTML}
      <div class="view-comments">${post.commentsText}</div>
      <div class="date">${post.date}</div>
    </div>
  `;

  feed.appendChild(article);
});
</script>

</body>
</html>
