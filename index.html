<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>Feed experimental</title>

  <style>
    /* ============================================================
       SIMULACIÓN ESTÁTICA DE FEED MÓVIL
       - Sin frameworks
       - Sin cookies, analytics, trackers ni conexiones externas
       - Sin acciones reales
       ============================================================ */

    :root {
      --feed-width: 470px;
      --border: #dbdbdb;
      --muted: #737373;
      --text: #0a0a0a;
      --bg: #ffffff;
      --topbar-height: 58px;
      --bottom-nav-height: 58px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      overflow-x: hidden;
    }

    body {
      margin: 0;
      min-width: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
      overscroll-behavior-x: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    /* Contenedor principal: móvil a ancho completo; escritorio centrado. */
    .app-shell {
      width: min(100%, var(--feed-width));
      min-height: 100vh;
      margin: 0 auto;
      background: #fff;
      border-left: 1px solid transparent;
      border-right: 1px solid transparent;
    }

    /* ---------------- Barra superior ---------------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: calc(var(--topbar-height) + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 14px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.97);
      border-bottom: 1px solid #efefef;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .brand {
      font-family: "Brush Script MT", "Segoe Script", cursive;
      font-size: 31px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: -1px;
      user-select: none;
      white-space: nowrap;
    }

    .top-icons,
    .action-left,
    .action-right {
      display: flex;
      align-items: center;
    }

    .top-icons {
      gap: 20px;
    }

    .icon {
      width: 25px;
      height: 25px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      pointer-events: none;
      user-select: none;
    }

    .icon svg {
      width: 100%;
      height: 100%;
      display: block;
      stroke: currentColor;
    }

    .heart-with-dot {
      position: relative;
    }

    .heart-with-dot::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      top: -1px;
      right: -2px;
      border-radius: 50%;
      background: #ff3040;
      border: 1.5px solid #fff;
    }

    /* ---------------- Stories ---------------- */
    .stories {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 11px 12px 10px;
      border-bottom: 1px solid #efefef;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .stories::-webkit-scrollbar {
      display: none;
    }

    .story {
      width: 68px;
      flex: 0 0 68px;
      text-align: center;
      user-select: none;
      pointer-events: none;
    }

    .story-ring {
      width: 62px;
      height: 62px;
      margin: 0 auto 5px;
      padding: 2px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 70% 70%, transparent 0 37px, rgba(255,255,255,0) 38px),
        conic-gradient(#d300c5, #ff3040, #ffdc80, #ff3040, #d300c5);
    }

    .story-ring-inner {
      width: 100%;
      height: 100%;
      padding: 2px;
      border-radius: 50%;
      background: #fff;
    }

    .story-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #eee;
    }

    .story-name {
      display: block;
      font-size: 11px;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ---------------- Feed y posts ---------------- */
    .feed {
      width: 100%;
      padding-bottom: calc(var(--bottom-nav-height) + env(safe-area-inset-bottom) + 46px);
    }

    .post {
      background: #fff;
      border-bottom: 1px solid #efefef;
    }

    .post-header {
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
    }

    .post-avatar {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      object-fit: cover;
      background: #eee;
      flex: 0 0 auto;
    }

    .post-meta {
      min-width: 0;
      flex: 1;
      line-height: 1.2;
    }

    .username {
      font-size: 14px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .location {
      margin-top: 2px;
      font-size: 12px;
      color: #262626;
      overflow-wrap: anywhere;
    }

    .more {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      line-height: 1;
      letter-spacing: 1px;
      pointer-events: none;
      user-select: none;
    }

    /* El aspect-ratio se define por publicación desde JavaScript.
       object-fit: contain evita recortes incorrectos. */
    .post-media {
      width: 100%;
      overflow: hidden;
      background: #f2f2f2;
      position: relative;
    }

    .post-media img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
    }

    .post-actions {
      height: 46px;
      padding: 9px 12px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      user-select: none;
    }

    .action-left {
      gap: 16px;
    }

    .post-body {
      padding: 0 12px 14px;
      font-size: 14px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .likes {
      font-weight: 650;
      margin-bottom: 6px;
    }

    .caption {
      margin-bottom: 5px;
    }

    .caption .caption-user,
    .comment .comment-user {
      font-weight: 650;
      margin-right: 5px;
    }

    .comment {
      margin: 2px 0;
    }

    .view-comments {
      margin-top: 5px;
      color: var(--muted);
    }

    .date {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      text-transform: none;
    }

    /* ---------------- Barra inferior ---------------- */
    .bottom-nav {
      position: fixed;
      z-index: 120;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, var(--feed-width));
      height: calc(var(--bottom-nav-height) + env(safe-area-inset-bottom));
      padding: 0 18px env(safe-area-inset-bottom);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.98);
      border-top: 1px solid #dedede;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      pointer-events: none;
      user-select: none;
    }

    .bottom-nav .icon {
      width: 27px;
      height: 27px;
    }

    .bottom-profile {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      border: 1px solid #111;
      object-fit: cover;
      background: #eee;
    }

    /* Evita que elementos decorativos sugieran interactividad. */
    .decorative {
      cursor: default !important;
      -webkit-tap-highlight-color: transparent;
    }

    /* Escritorio: leve contención visual, sin cambiar el estímulo central. */
    @media (min-width: 700px) {
      .app-shell {
        border-left-color: #efefef;
        border-right-color: #efefef;
      }
    }

    /* Ajustes finos para móviles habituales. */
    @media (max-width: 414px) {
      .topbar {
        padding-left: 12px;
        padding-right: 12px;
      }

      .brand {
        font-size: 29px;
      }

      .stories {
        gap: 11px;
      }
    }

    @media (max-width: 360px) {
      .story {
        width: 64px;
        flex-basis: 64px;
      }

      .story-ring {
        width: 58px;
        height: 58px;
      }

      .post-body {
        font-size: 13.5px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <header class="topbar decorative" aria-label="Barra superior decorativa">
      <div class="brand" aria-label="Instagram">Instagram</div>
      <div class="top-icons" aria-hidden="true">
        <span class="icon heart-with-dot" data-icon="heart"></span>
        <span class="icon" data-icon="messages"></span>
      </div>
    </header>

    <section id="stories" class="stories decorative" aria-label="Historias decorativas"></section>

    <main id="feed" class="feed" aria-label="Feed de publicaciones"></main>
  </div>

  <nav class="bottom-nav decorative" aria-label="Navegación inferior decorativa">
    <span class="icon" data-icon="home"></span>
    <span class="icon" data-icon="search"></span>
    <span class="icon" data-icon="create"></span>
    <span class="icon" data-icon="reels"></span>
    <img class="bottom-profile" src="images/profile01.jpg" alt="">
  </nav>

  <script>
    "use strict";

    /* ============================================================
       1) DATOS EDITABLES
       Modifica aquí usuarios, imágenes, ubicación, likes, textos,
       comentarios y fecha. El orden del array = orden del feed.

       IMPORTANTE PARA ESTABILIDAD:
       - aspectRatio debe corresponder a la proporción de la imagen.
       - Ejemplos:
         "4 / 5"  -> retrato habitual de Instagram
         "1 / 1"  -> cuadrada
         "3 / 4"  -> retrato
         "16 / 9" -> horizontal
       ============================================================ */

    const posts = [
      {
        username: "gabo_mtnez",
        profileImage: "images/profile01.jpg",
        image: "images/post01.jpg",
        imageAlt: "Fotografía de ejemplo de una publicación",
        aspectRatio: "4 / 5",
        location: "Aeropuerto",
        likes: 213,
        caption: "Siempre en algún aeropuerto. #lifeisgood",
        comments: [
          { username: "agus.alv", text: "😍😍😍" },
          { username: "vale_r", text: "Buen viaje ✈️" }
        ],
        totalComments: 8,
        date: "Hace 2 días"
      },
      {
        username: "nacho.gonzalez",
        profileImage: "images/profile02.jpg",
        image: "images/post02.jpg",
        imageAlt: "Fotografía de ejemplo de una publicación",
        aspectRatio: "4 / 5",
        location: "Santiago, Chile",
        likes: 30,
        caption: "Con los mejores.",
        comments: [
          { username: "martinalvarezs", text: "los amo 🥺💗" },
          { username: "pablitocanales_", text: "wena fotitooo 📸" }
        ],
        totalComments: 34,
        date: "Ayer"
      },
      {
        username: "marrtiinn_21",
        profileImage: "images/profile03.jpg",
        image: "images/post03.jpg",
        imageAlt: "Fotografía de ejemplo de una publicación",
        aspectRatio: "4 / 5",
        location: "",
        likes: 86,
        caption: "Juntos 🤍",
        comments: [
          { username: "diegomella_", text: "los más facheros 🤝" },
          { username: "javii.caballoo", text: "los más lindosss ❤️" }
        ],
        totalComments: 24,
        date: "Hace 2 horas"
      },
      {
        username: "Koke_Aravena",
        profileImage: "images/profile04.jpg",
        image: "images/post04.jpg",
        imageAlt: "Fotografía de ejemplo de una publicación",
        aspectRatio: "4 / 5",
        location: "Cajón del Maipo",
        likes: 57,
        caption: "30 kms en 2 horas. Meta de pedaleo cumplida. 🚴",
        comments: [
          { username: "martina.gonzalezz", text: "Eso amigo, vamos por más." }
        ],
        totalComments: 1,
        date: "Hace 3 días"
      },
      {
        username: "la_nico_",
        profileImage: "images/profile05.jpg",
        image: "images/post05.jpg",
        imageAlt: "Fotografía de ejemplo de una publicación",
        aspectRatio: "4 / 5",
        location: "Santiago, Chile",
        likes: 59,
        caption: "¿Qué opinan, se nota el efecto gym? 🍑",
        comments: [
          { username: "cami.g", text: "🔥🔥🔥" },
          { username: "mati_22", text: "❤️❤️" }
        ],
        totalComments: 12,
        date: "Hace 1 día"
      },
      {
        username: "vale.viaja",
        profileImage: "images/profile06.jpg",
        image: "images/post06.jpg",
        imageAlt: "Fotografía de ejemplo de una publicación",
        aspectRatio: "4 / 5",
        location: "París, Francia",
        likes: 184,
        caption: "Cumpliendo sueños ✨",
        comments: [
          { username: "cata.cl", text: "Qué hermoso 😍" },
          { username: "sofi_ig", text: "Necesito estar ahí 💕" }
        ],
        totalComments: 19,
        date: "Hace 4 días"
      },
      {
        username: "mati.practica",
        profileImage: "images/profile07.jpg",
        image: "images/post07.jpg",
        imageAlt: "Fotografía de ejemplo de una publicación",
        aspectRatio: "4 / 5",
        location: "Providencia, Santiago",
        likes: 96,
        caption: "Primer día de práctica y no puedo estar más feliz 🙌",
        comments: [
          { username: "nico_r", text: "Seco 👏" },
          { username: "javi.mv", text: "Te irá increíble ✨" }
        ],
        totalComments: 7,
        date: "Hace 6 horas"
      },
      {
        username: "cami.intercambio",
        profileImage: "images/profile08.jpg",
        image: "images/post08.jpg",
        imageAlt: "Fotografía de ejemplo de una publicación",
        aspectRatio: "4 / 5",
        location: "Salamanca, España",
        likes: 143,
        caption: "Un semestre que no voy a olvidar 💫",
        comments: [
          { username: "anto.v", text: "Qué experiencia 😍" },
          { username: "fran_19", text: "Disfruta muchísimo ❤️" }
        ],
        totalComments: 16,
        date: "Hace 5 días"
      }
    ];

    const stories = [
      { username: "gabo_mtnez", image: "images/profile01.jpg" },
      { username: "nacho.gonzalez", image: "images/profile02.jpg" },
      { username: "marrtiinn_21", image: "images/profile03.jpg" },
      { username: "la_nico_", image: "images/profile05.jpg" },
      { username: "vale.viaja", image: "images/profile06.jpg" },
      { username: "cami.intercambio", image: "images/profile08.jpg" }
    ];

    /* ============================================================
       2) SVG DECORATIVOS
       No contienen enlaces ni eventos de clic.
       ============================================================ */

    const icons = {
      heart: `
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>
        </svg>`,
      comment: `
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 1 1 21 11.5z"/>
        </svg>`,
      share: `
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2 11 13"/>
          <path d="m22 2-7 20-4-9-9-4 20-7z"/>
        </svg>`,
      save: `
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 3h14a1 1 0 0 1 1 1v17l-8-5-8 5V4a1 1 0 0 1 1-1z"/>
        </svg>`,
      messages: `
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2 11 13"/>
          <path d="m22 2-7 20-4-9-9-4 20-7z"/>
        </svg>`,
      home: `
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>
        </svg>`,
      search: `
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-4-4"/>
        </svg>`,
      create: `
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <path d="M12 7v10M7 12h10"/>
        </svg>`,
      reels: `
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <path d="M3 9h18M8 3l3 6M14 3l3 6"/>
          <path d="m10 13 5 3-5 3z"/>
        </svg>`
    };

    document.querySelectorAll("[data-icon]").forEach(el => {
      el.innerHTML = icons[el.dataset.icon] || "";
    });

    /* ============================================================
       3) RENDER DETERMINISTA
       No usa Math.random(), API, red, storage ni datos del usuario.
       ============================================================ */

    function formatNumber(value) {
      return String(value).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function createStory(story) {
      const item = document.createElement("div");
      item.className = "story";

      const ring = document.createElement("div");
      ring.className = "story-ring";

      const inner = document.createElement("div");
      inner.className = "story-ring-inner";

      const img = document.createElement("img");
      img.src = story.image;
      img.alt = "";
      img.width = 400;
      img.height = 400;
      img.decoding = "async";

      const name = document.createElement("span");
      name.className = "story-name";
      name.textContent = story.username;

      inner.appendChild(img);
      ring.appendChild(inner);
      item.append(ring, name);
      return item;
    }

    function createPost(post) {
      const article = document.createElement("article");
      article.className = "post";

      // Header
      const header = document.createElement("div");
      header.className = "post-header";

      const avatar = document.createElement("img");
      avatar.className = "post-avatar";
      avatar.src = post.profileImage;
      avatar.alt = "";
      avatar.width = 400;
      avatar.height = 400;
      avatar.decoding = "async";

      const meta = document.createElement("div");
      meta.className = "post-meta";

      const username = document.createElement("div");
      username.className = "username";
      username.textContent = post.username;
      meta.appendChild(username);

      if (post.location) {
        const location = document.createElement("div");
        location.className = "location";
        location.textContent = post.location;
        meta.appendChild(location);
      }

      const more = document.createElement("div");
      more.className = "more";
      more.setAttribute("aria-hidden", "true");
      more.textContent = "•••";

      header.append(avatar, meta, more);

      // Media
      const media = document.createElement("div");
      media.className = "post-media";
      media.style.aspectRatio = post.aspectRatio || "4 / 5";

      const image = document.createElement("img");
      image.src = post.image;
      image.alt = post.imageAlt || "Imagen de publicación";
      image.decoding = "async";
      image.loading = "eager";
      media.appendChild(image);

      // Actions
      const actions = document.createElement("div");
      actions.className = "post-actions decorative";
      actions.setAttribute("aria-hidden", "true");
      actions.innerHTML = `
        <div class="action-left">
          <span class="icon">${icons.heart}</span>
          <span class="icon">${icons.comment}</span>
          <span class="icon">${icons.share}</span>
        </div>
        <div class="action-right">
          <span class="icon">${icons.save}</span>
        </div>
      `;

      // Body
      const body = document.createElement("div");
      body.className = "post-body";

      const likes = document.createElement("div");
      likes.className = "likes";
      likes.textContent = `${formatNumber(post.likes)} Me gusta`;

      const caption = document.createElement("div");
      caption.className = "caption";
      const captionUser = document.createElement("span");
      captionUser.className = "caption-user";
      captionUser.textContent = post.username;
      const captionText = document.createElement("span");
      captionText.textContent = post.caption;
      caption.append(captionUser, captionText);

      body.append(likes, caption);

      post.comments.forEach(c => {
        const comment = document.createElement("div");
        comment.className = "comment";

        const cu = document.createElement("span");
        cu.className = "comment-user";
        cu.textContent = c.username;

        const ct = document.createElement("span");
        ct.textContent = c.text;

        comment.append(cu, ct);
        body.appendChild(comment);
      });

      const viewComments = document.createElement("div");
      viewComments.className = "view-comments";
      viewComments.textContent =
        post.totalComments === 1
          ? "Ver 1 comentario"
          : `Ver los ${formatNumber(post.totalComments)} comentarios`;

      const date = document.createElement("div");
      date.className = "date";
      date.textContent = post.date;

      body.append(viewComments, date);
      article.append(header, media, actions, body);
      return article;
    }

    const storiesContainer = document.getElementById("stories");
    stories.forEach(story => storiesContainer.appendChild(createStory(story)));

    const feed = document.getElementById("feed");
    posts.forEach(post => feed.appendChild(createPost(post)));
  </script>
</body>
</html>
